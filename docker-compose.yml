services:
  # nginx - takes the incoming requests and triggers PHP interpreter
  server:
    image: "nginx:stable-alpine"
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  # PHP interpreter - running and executing PHP code
  php:
    build:
      context: ./dockerfiles
      dockerfile: php.dockerfile
    volumes:
      - ./src:/var/www/html:delegated
    # ports:
    #   - "3000:9000"   # we don't need to communicate with PHP container, only nginx needs to communicate so we don't need to expose it, instead we can just change PORT to 9000 in nginx.conf

  mysql:
    image: mysql:5.7
    env_file:
      - ./env/mysql.env

